name: Release Windows installer

on:
  push:
    tags:
      - "juju_v*"

permissions:
  contents: write

jobs:
  release-win64:
    name: Build and publish win-x64 installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^juju_v(?<version>\d+\.\d+\.\d+)$') {
            throw "Invalid release tag '$env:GITHUB_REF_NAME'. Expected juju_vx.y.z, for example juju_v2.0.0."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci
        working-directory: editor

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/Juju.App/Juju.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.tag.outputs.version }}
          -o artifacts/win-x64

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DAppVersion=$env:APP_VERSION" 'installer\juju.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = "artifacts\installer\juju_v{0}_setup_win64.exe" -f $env:APP_VERSION
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: juju ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: artifacts/installer/juju_v${{ steps.tag.outputs.version }}_setup_win64.exe
