name: Release Windows installers

on:
  push:
    tags:
      - "juju_v*"

permissions:
  contents: write

jobs:
  release-win64:
    name: Build and publish win-x64 installers
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^juju_v(?<version>\d+\.\d+\.\d+)$') {
            throw "Invalid release tag '$env:GITHUB_REF_NAME'. Expected juju_vx.y.z, for example juju_v2.0.0."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build both installers and update assets
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.tag.outputs.version }}
        run: .\scripts\build-release.ps1 -Version $env:APP_VERSION

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: juju ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/installer/juju_v${{ steps.tag.outputs.version }}_setup_win64.exe
            artifacts/installer/juju_v${{ steps.tag.outputs.version }}_setup_win64_light.exe
            artifacts/release/juju_v${{ steps.tag.outputs.version }}_win-x64.zip
            artifacts/release/juju_v${{ steps.tag.outputs.version }}_win-x64_light.zip
            artifacts/release/juju_v${{ steps.tag.outputs.version }}_manifest.json
            artifacts/release/juju_v${{ steps.tag.outputs.version }}_manifest_light.json
            artifacts/release/juju_latest.json
            artifacts/release/juju_latest_light.json
