name: Release Windows executable

on:
  push:
    tags:
      - "juju_v*"

permissions:
  contents: write

jobs:
  release-win64:
    name: Build and publish win-x64 executable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^juju_v(?<version>\d+\.\d+\.\d+)$') {
            throw "Invalid release tag '$env:GITHUB_REF_NAME'. Expected juju_vx.y.z, for example juju_v2.0.0."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build executable
        run: pnpm package:exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: juju ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: artifacts/Juju.exe
