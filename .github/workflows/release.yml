name: Release Windows installer

on:
  push:
    tags:
      - "juju_v*"

permissions:
  contents: write

jobs:
  release-win64:
    name: Build and publish win-x64 installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start with clean release artifacts
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'artifacts') {
            Remove-Item -LiteralPath 'artifacts' -Recurse -Force
          }

      - name: Validate release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^juju_v(?<version>\d+\.\d+\.\d+)$') {
            throw "Invalid release tag '$env:GITHUB_REF_NAME'. Expected juju_vx.y.z, for example juju_v2.0.0."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci
        working-directory: editor

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/Juju.App/Juju.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.tag.outputs.version }}
          -o artifacts/win-x64

      - name: Publish stable launcher and updater
        run: |
          dotnet publish src/Juju.Launcher/Juju.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=1.0.0 -o artifacts/bootstrap
          if ($LASTEXITCODE -ne 0) { throw "Launcher publish failed with exit code $LASTEXITCODE" }
          dotnet publish src/Juju.Updater/Juju.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=1.0.0 -o artifacts/bootstrap
          if ($LASTEXITCODE -ne 0) { throw "Updater publish failed with exit code $LASTEXITCODE" }
        shell: pwsh

      - name: Create versioned update package and manifest
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $packageName = "juju_v{0}_win-x64.zip" -f $env:APP_VERSION
          $manifestName = "juju_v{0}_manifest.json" -f $env:APP_VERSION
          $packagePath = Join-Path $PWD "artifacts\release\$packageName"
          $manifestPath = Join-Path $PWD "artifacts\release\$manifestName"
          $latestManifestPath = Join-Path $PWD 'artifacts\release\juju_latest.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $packagePath) | Out-Null
          Compress-Archive -Path 'artifacts\win-x64\*' -DestinationPath $packagePath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageSize = (Get-Item -LiteralPath $packagePath).Length
          $manifest = [ordered]@{
            schemaVersion = 1
            version = $env:APP_VERSION
            channel = 'stable'
            rid = 'win-x64'
            packageAsset = $packageName
            packageSizeBytes = $packageSize
            sha256 = $hash
            minimumLauncherVersion = '1.0.0'
            releaseNotesUrl = "https://github.com/qlxsply/juju/releases/tag/juju_v$($env:APP_VERSION)"
          } | ConvertTo-Json
          $encoding = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($manifestPath, $manifest, $encoding)
          [IO.File]::WriteAllText($latestManifestPath, $manifest, $encoding)
          if ((Get-Item -LiteralPath $packagePath).Length -gt 1GB) { throw 'Update package exceeds 1 GB.' }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DAppVersion=$env:APP_VERSION" 'installer\juju.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = "artifacts\installer\juju_v{0}_setup_win64.exe" -f $env:APP_VERSION
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: juju ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/installer/juju_v${{ steps.tag.outputs.version }}_setup_win64.exe
            artifacts/release/juju_v${{ steps.tag.outputs.version }}_win-x64.zip
            artifacts/release/juju_v${{ steps.tag.outputs.version }}_manifest.json
            artifacts/release/juju_latest.json
